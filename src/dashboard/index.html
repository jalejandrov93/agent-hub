<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>agent-hub dashboard</title>
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">agent-hub</div>
    <nav id="nav" class="nav" aria-label="Primary">
      <div class="nav-group">
        <div class="nav-group-label">Monitor</div>
        <a class="nav-item" data-route="overview" href="#/overview">
          <span class="nav-icon" data-icon="overview"></span>
          <span class="nav-label">Overview</span>
          <span class="nav-badge" data-badge="overview" hidden></span>
        </a>
        <a class="nav-item" data-route="agents" href="#/agents">
          <span class="nav-icon" data-icon="agents"></span>
          <span class="nav-label">Agents</span>
          <span class="nav-badge" data-badge="agents" hidden></span>
        </a>
        <a class="nav-item" data-route="jobs" href="#/jobs">
          <span class="nav-icon" data-icon="jobs"></span>
          <span class="nav-label">Running jobs</span>
          <span class="nav-badge" data-badge="jobs" hidden></span>
        </a>
        <a class="nav-item" data-route="history" href="#/history">
          <span class="nav-icon" data-icon="history"></span>
          <span class="nav-label">Job history</span>
          <span class="nav-badge" data-badge="history" hidden></span>
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">Activity</div>
        <a class="nav-item" data-route="subagents" href="#/subagents">
          <span class="nav-icon" data-icon="subagents"></span>
          <span class="nav-label">Claude subagents</span>
          <span class="nav-badge" data-badge="subagents" hidden></span>
        </a>
        <a class="nav-item" data-route="timeline" href="#/timeline">
          <span class="nav-icon" data-icon="timeline"></span>
          <span class="nav-label">Timeline</span>
          <span class="nav-badge" data-badge="timeline" hidden></span>
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">System</div>
        <a class="nav-item" data-route="config" href="#/config">
          <span class="nav-icon" data-icon="config"></span>
          <span class="nav-label">Config</span>
          <span class="nav-badge" data-badge="config" hidden></span>
        </a>
      </div>
    </nav>
  </aside>

  <div id="nav-drawer" class="drawer" popover="manual">
    <div class="drawer-scroller">
      <nav class="drawer-sheet" tabindex="-1" aria-label="Primary"></nav>
    </div>
  </div>

  <div class="app-main">
    <header class="topbar">
      <button id="drawer-toggle" class="drawer-toggle btn btn-icon" aria-controls="nav-drawer" aria-expanded="false" aria-label="Open navigation"></button>
      <h2 id="topbar-title" class="topbar-title">Overview</h2>
      <div class="topbar-meta">
        <span id="conn-badge" class="badge">Connecting…</span>
        <span id="last-updated" class="muted"></span>
      </div>
      <button id="btn-refresh" class="btn btn-ghost">Refresh</button>
      <label for="theme-select" class="sr-only">Theme</label>
      <select id="theme-select">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </header>
    <main id="main-content" tabindex="-1"></main>
  </div>

  <div id="live-region" class="sr-only" aria-live="polite"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <dialog id="confirm-dialog" class="confirm" closedby="any" aria-labelledby="confirm-title">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <div class="confirm-actions">
      <button id="confirm-cancel" class="btn">Cancel</button>
      <button id="confirm-ok" class="btn btn-primary">Confirm</button>
    </div>
  </dialog>
</div>
</body>
</html>
